# this_file: deny.toml
#
# cargo-deny configuration for twars-url2md.
# Run:  cargo deny check
# CI:   add `cargo install cargo-deny && cargo deny check` to a workflow step.
#
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
# Analyse the full dependency graph (default).
all-features = false
no-default-features = false

# ---------------------------------------------------------------------------
# Security advisories
# ---------------------------------------------------------------------------
[advisories]
# Deny any crate listed in the RustSec advisory database.
version = 2
ignore = []

# ---------------------------------------------------------------------------
# License policy
# ---------------------------------------------------------------------------
[licenses]
version = 2
# Accepted SPDX identifiers — add more if needed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "OpenSSL",
    "Zlib",
]
# Confidence threshold for licence SPDX expression detection.
confidence-threshold = 0.8

# ---------------------------------------------------------------------------
# Source bans — only allow crates from crates.io and the local workspace.
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# ---------------------------------------------------------------------------
# Duplicate crates (informational — warn rather than deny for now)
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"
